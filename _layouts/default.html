---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{% if page.lang == 'zh' %}zh-CN{% else %}{{ site.locale | slice: 0,2 }}{% endif %}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    <script>
      try {
        if (localStorage.getItem('cyberpunk') === 'on') {
          document.documentElement.setAttribute('data-cyberpunk', 'on');
        }
      } catch (error) {}
    </script>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body class="{% if page.classes %}{{ page.classes | join: ' ' }}{% endif %}{% if page.collection %} collection-{{ page.collection }}{% endif %}{% if page.lang == 'zh' %} language-zh{% endif %}">

    {% include browser-upgrade.html %}
    {% include masthead.html %}
    <div class="cyberpunk-lights" aria-hidden="true">
      <span class="cyberpunk-firefly cyberpunk-firefly--1"></span>
      <span class="cyberpunk-firefly cyberpunk-firefly--2"></span>
      <span class="cyberpunk-firefly cyberpunk-firefly--3"></span>
      <span class="cyberpunk-firefly cyberpunk-firefly--4"></span>
      <span class="cyberpunk-firefly cyberpunk-firefly--5"></span>
      <span class="cyberpunk-firefly cyberpunk-firefly--6"></span>
      <span class="cyberpunk-firefly cyberpunk-firefly--7"></span>
    </div>

    {{ content }}

    <div class="page__footer">
      <footer>
        {% include footer/custom.html %}
        {% include footer.html %}
      </footer>
    </div>

    {% include scripts.html %}

    <div class="site-watermark" aria-hidden="true"><span>福祿義德</span><small>FLUID</small></div>

  </body>
</html>
